<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face Emotion Recognition - Vocally</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .face-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-top: 80px;
            padding: 20px;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            max-width: 800px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .video-wrapper img {
            width: 100%;
            display: block;
        }
        
        .face-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 32px;
            margin-bottom: 20px;
            text-align: center;
            background: linear-gradient(90deg, #f65c8b, #ff1f5e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .face-subtitle {
            color: var(--text-muted);
            margin-bottom: 40px;
            text-align: center;
            max-width: 600px;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="logo">Vocally</div>
        <ul class="nav-links">
            <li><a href="/">Home</a></li>
            <li><a href="/app">Voice Emotion</a></li>
        </ul>
        <a href="/"><button class="nav-btn">Back to Home</button></a>
    </nav>

    <!-- Main Content -->
    <main class="container face-container">
        <h1 class="face-title">Real-Time Facial Emotion Detection</h1>
        <p class="face-subtitle">Look directly at your webcam to see the AI analyze your emotional state in real-time using DeepFace and OpenCV.</p>
        
        <div class="video-wrapper">
            <!-- This image tag continuously reloads the frame generated by Flask -->
            <img src="{{ url_for('video_feed') }}" alt="Video Stream">
        </div>
    </main>
</body>
</html>
